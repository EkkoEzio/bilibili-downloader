<h1>安装 B站下载</h1>
<p>即将把 <b>B站下载</b> 安装到「应用程序」文件夹。</p>
<ul>
  <li>这是一个本地运行的 B 站视频下载器，下载、任务记录与登录态都保存在你自己的电脑上。</li>
  <li>应用数据写在用户目录（<b>~/Library/Application Support/BiliDownloader</b>），不写进程序目录，删掉应用不会损坏你的任务记录。</li>
  <li>首次打开如果系统提示「无法验证开发者」，请右键点应用 →「打开」，或到「系统设置 → 隐私与安全性」点「仍要打开」。</li>
  <li>首次使用请先登录：扫码登录 / 自动读取本机 Edge 登录态 / 导入 cookies.txt，三选一。</li>
</ul>
