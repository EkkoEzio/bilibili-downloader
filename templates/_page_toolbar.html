{# 刷新/视图切换/昼夜切换已收进顶栏(齿轮左侧,2026-11-18 用户要求),
   工具条只留搜索框;search_id/search_style 保留给收藏夹首屏隐藏搜索。 #}
{% macro lib_toolbar(placeholder, search_id='', search_style='') %}
<div class="ph-right">
  <div class="search-wrap">
    <svg class="search-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" class="search-input lib-search" aria-label="搜索当前页面"
      {%- if search_id %} id="{{ search_id }}"{% endif %} placeholder="{{ placeholder }}" oninput="applyLibFilter()"
      {%- if search_style %} style="{{ search_style }}"{% endif %}>
    <button class="search-clear" type="button" hidden aria-label="清除">×</button>
  </div>
</div>
{% endmacro %}
