name: 打包发布

# 发版:打一个 tag 就出三个安装包(mac arm64 / mac x86_64 / windows x64)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "手动触发时的版本号(不带 v,如 2.9.0);会用于版本对账与发布 tag"
        required: false
      platforms:
        description: '只构建这些平台,JSON 数组。如 ["win-x64"] 或 ["mac-arm64","mac-x86_64","win-x64"]'
        default: '["mac-arm64","mac-x86_64","win-x64"]'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 平台列表可由 workflow_dispatch 的 platforms 输入裁剪:
        # 调试单个平台时不用等 macOS runner 排队(2026-11-22 实测 mac 排队很久)。
        name: ${{ fromJSON(github.event.inputs.platforms || '["mac-arm64","mac-x86_64","win-x64"]') }}
        include:
          # runner 标签要显式写架构,不靠默认值:默认标签会随时间漂移
          # (macos-latest 现在指向 macos-26)。
          #
          # arm64 的标签是 `macos-15`,不是 `macos-15-arm64`——后者不是
          # 有效标签(官方 runner-images README 里 macOS 15 Arm64 一行写的
          # 是 `macos-15` / `macos-15-xlarge`)。写错的后果不是报错,而是
          # job 永远排队不调度:2026-11-22 连续 5 次 run 的 mac-arm64 都是
          # queued 且 runner_name 为空,而 mac-x86_64(macos-15-intel)秒起。
          - name: mac-arm64
            os: macos-15
            arch: arm64
            py_arch: arm64
            archflags: "-arch arm64"
          - name: mac-x86_64
            os: macos-15-intel
            arch: x86_64
            py_arch: x64
            archflags: "-arch x86_64"
          - name: win-x64
            os: windows-latest
            arch: x64
            py_arch: x64
            archflags: ""
    steps:
      - uses: actions/checkout@v4

      # 2026-11-23 审查(遗留项 19):任意 v* tag 都会触发构建,但此前从不
      # 对账 VERSION——tag 打错就会以错误版本号出包并发布。第一道闸:
      # tag 触发时对 GITHUB_REF_NAME,手动触发时对 version 输入(原先从未
      # 被读取);不一致直接 fail-fast,不烧三个平台的构建时长。
      - name: 校验 tag 与 VERSION 一致
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          VER="$(cat VERSION | tr -d '[:space:]')"
          EXPECTED="v${VER}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ACTUAL="${GITHUB_REF_NAME}"
          else
            ACTUAL="${{ github.event.inputs.version }}"
          fi
          if [[ -z "${ACTUAL}" ]]; then
            echo "手动触发未给 version 输入,以 VERSION 为准,跳过对账"
            exit 0
          fi
          # 两边都去掉可能存在的前导 v 再比:手动触发的 version 输入按
          # 文档写的是不带 v 的 2.11.0,tag 触发带 v,原来直接比字符串会让
          # 手动触发永远对账失败(该输入此前从未被读取,这条路径没人走过)。
          NORMALIZED="${ACTUAL#v}"
          if [[ "${NORMALIZED}" != "${VER}" ]]; then
            echo "::error::版本不一致:触发标识 ${ACTUAL} 与 VERSION(${VER}) 不符"
            exit 1
          fi
          echo "版本对账通过:${EXPECTED}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.py_arch }}

      - name: 安装依赖
        run: |
          echo "版本: $(cat VERSION)"
          python -c "import platform,sys;print('解释器:',platform.machine(),sys.version.split()[0])"
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt -r requirements-build.txt

      # Windows 要出单文件安装程序,需要 Inno Setup(编译 .iss)
      - name: 安装 Inno Setup(仅 Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress

      # 源码先复制到不含个人信息的临时目录再打包:
      # .pyc 的 co_filename 会留下编译时的源码路径,在开发者机器上直接
      # 打包会把家目录路径烧进安装包。三个平台走同一套暂存+打包+扫描流程。
      - name: 打包(暂存目录 + 隐私扫描)
        shell: bash
        # macOS arm64 上 PyInstaller 链接大二进制时会报
        # "Fatal error: too many symbols in thin binary"(Python 3.11+ 已知
        # 问题),显式给 linker 指定架构可以绕开;x86_64 同理显式指定,
        # 免得宿主架构漂移。Windows 不读这个变量。
        env:
          ARCHFLAGS: ${{ matrix.archflags }}
        run: |
          chmod +x scripts/build_local.sh
          ARCH=${{ matrix.arch }} bash scripts/build_local.sh

      # 冻结后的包必须能真的启动:模板找得到、静态资源出得来、
      # 数据目录被外置——这是打包链路唯一能自动判定的端到端检查。
      # 打包成 GUI 后没有终端,自检用退出码汇报(0 = 就绪)。
      - name: 冒烟自检(冻结后的包能不能启动)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            BIN="dist/BiliDownloader.app/Contents/MacOS/BiliDownloader"
          else
            BIN="dist/BiliDownloader/BiliDownloader.exe"
          fi
          chmod +x "$BIN" 2>/dev/null || true
          "$BIN" --selftest
          echo "selftest 通过(exit=$?)"

      - name: 上传产物(只传安装包)
        uses: actions/upload-artifact@v4
        with:
          name: bili-${{ matrix.name }}
          # 只上传安装包,不传 dist/ 整个目录:
          # dist/ 里还有 .app bundle 和 Windows onedir 目录,这些目录会被
          # Release job 的 artifacts/* 通配符当成「文件」上传,直接 EISDIR 失败。
          # mac 出 .dmg,Windows 出 .exe,两个平台各命中自己那一个。
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.pkg
          if-no-files-found: error

  release:
    name: 发布到 Releases
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出产物
        run: ls -la artifacts

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发(workflow_dispatch)时 ref 是分支、没有 tag,不给
          # tag_name 会发布失败;按 version 输入补出 vX.Y.Z。tag 触发时
          # 直接用 ref 里的 tag 名。
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.pkg
          draft: false
          generate_release_notes: true
