name: 打包发布

# 发版:打一个 tag 就出三个安装包(mac arm64 / mac x86_64 / windows x64)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "手动触发时的版本号(如 2.9.0)"
        required: false
      platforms:
        description: '只构建这些平台,JSON 数组。如 ["win-x64"] 或 ["mac-arm64","mac-x86_64","win-x64"]'
        default: '["mac-arm64","mac-x86_64","win-x64"]'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 平台列表可由 workflow_dispatch 的 platforms 输入裁剪:
        # 调试单个平台时不用等 macOS runner 排队(2026-11-22 实测 mac 排队很久)。
        name: ${{ fromJSON(github.event.inputs.platforms || '["mac-arm64","mac-x86_64","win-x64"]') }}
        include:
          # runner 标签要显式写架构,不靠默认值:GitHub 已把 macos-14 下线
          # (报 "The configuration 'macos-14-arm64-us-default' is not
          # supported"),默认标签也会随时间漂移。macos-15 有 arm64/intel
          # 两个变体,分别对应两个 mac 包。
          - name: mac-arm64
            os: macos-15-arm64
            arch: arm64
            py_arch: arm64
          - name: mac-x86_64
            os: macos-15-intel
            arch: x86_64
            py_arch: x64
          - name: win-x64
            os: windows-latest
            arch: x64
            py_arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.py_arch }}

      - name: 安装依赖
        run: |
          echo "版本: $(cat VERSION)"
          python -c "import platform,sys;print('解释器:',platform.machine(),sys.version.split()[0])"
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt -r requirements-build.txt

      # Windows 要出单文件安装程序,需要 Inno Setup(编译 .iss)
      - name: 安装 Inno Setup(仅 Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress

      # 源码先复制到不含个人信息的临时目录再打包:
      # .pyc 的 co_filename 会留下编译时的源码路径,在开发者机器上直接
      # 打包会把家目录路径烧进安装包。三个平台走同一套暂存+打包+扫描流程。
      - name: 打包(暂存目录 + 隐私扫描)
        shell: bash
        run: |
          chmod +x scripts/build_local.sh
          ARCH=${{ matrix.arch }} bash scripts/build_local.sh

      # 冻结后的包必须能真的启动:模板找得到、静态资源出得来、
      # 数据目录被外置——这是打包链路唯一能自动判定的端到端检查。
      # 打包成 GUI 后没有终端,自检用退出码汇报(0 = 就绪)。
      - name: 冒烟自检(冻结后的包能不能启动)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            BIN="dist/BiliDownloader.app/Contents/MacOS/BiliDownloader"
          else
            BIN="dist/BiliDownloader/BiliDownloader.exe"
          fi
          chmod +x "$BIN" 2>/dev/null || true
          "$BIN" --selftest
          echo "selftest 通过(exit=$?)"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: bili-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  release:
    name: 发布到 Releases
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出产物
        run: ls -la artifacts

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
